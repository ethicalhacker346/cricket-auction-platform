# ═══════════════════════════════════════════════════════════════
# Railway Deployment Configuration
# Deploy: railway up
# ═══════════════════════════════════════════════════════════════

build:
  builder: DOCKERFILE

deploy:
  healthcheckPath: /health
  healthcheckTimeout: 30
  restartPolicyType: ON_FAILURE
  restartPolicyMaxRetries: 10
  numReplicas: 2
  
  resources:
    memory: 512Mi
    cpu: 1

  cronJobs:
    - name: cleanup-orphaned-images
      command: "node jobs/cleanupOrphanedImages.js"
      schedule: "0 3 * * 0"