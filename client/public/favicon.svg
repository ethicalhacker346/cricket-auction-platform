<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Tailwind bg-gradient-to-br: from-amber-400 (#fbbf24) to-rose-500 (#f43f5e) -->
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
 
  <!-- Container: h-9 w-9 rounded-xl bg-gradient-to-br, scaled 36px -> 128px (rounded-xl = 12px -> ~42.7px) -->
  <rect x="0" y="0" width="128" height="128" rx="42.7" ry="42.7" fill="url(#brandGradient)" />
 
  <!-- Icon: lucide "Gavel", h-4 w-4 text-slate-950 (#020617), centered, scaled from 24px icon box to ~56.9px, offset ~35.6px -->
  <g transform="translate(35.6,35.6) scale(2.37)"
     fill="none"
     stroke="#020617"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="m14.5 12.5-8 8a2.119 2.119 0 1 1-3-3l8-8" />
    <path d="m16 16 6-6" />
    <path d="m8 8 6-6" />
    <path d="m9 7 8 8" />
    <path d="m21 11-8-8" />
  </g>
</svg>